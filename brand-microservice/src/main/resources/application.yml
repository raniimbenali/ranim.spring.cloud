spring:
  application:
    name: brand
  profiles:
    active: "prod"
  config:
    # PDF 05: the properties build.version and author.* are read from the Config Server
    import: "optional:configserver:http://localhost:9999/"
  datasource:
    url: 'jdbc:h2:mem:branddb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true      # PDF 06 (run alone in Docker): set to false
    discovery:
      enabled: true      # PDF 06 (run alone in Docker): set to false
eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
management:
  endpoints:
    web:
      exposure:
        include: '*'
