server:
  port: 8888
spring:
  application:
    name: gatewayserver
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: false          # default routing (true): http://localhost:8888/BRAND/api/brands/MAC
          lowerCaseServiceId: true
      routes:                     # routes configured in application.yml
        - id: r1
          uri: lb://BRAND
          predicates:
            - Path=/api/brands/**
        - id: r2
          uri: lb://PRODUCT
          predicates:
            - Path=/api/products/**
eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    gateway:
      access: unrestricted
